name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package jsplugin
        run: zip -r song-organizer.jsplugin.zip plugin.json main.js static icon.png
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: song-organizer.jsplugin.zip
